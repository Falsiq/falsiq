[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "falsiq"
version = "0.1.0"
description = "Adversarial intent elicitation before coding agents implement"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
falsiq = "falsiq.cli:main"
falsiq-agent = "falsiq.agent_runtime:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["falsiq"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
